[workspace]
resolver = "3"
members = [
    "crates/mf-core",
    "crates/mf-eml",
    "crates/mf-msg",
    "crates/mf-analysis",
    "crates/mf-engine",
    "crates/mf-cli",
    "crates/mf-wasm",
    "apps/desktop/src-tauri",
]
# L'app de bureau nécessite webkit2gtk sous Linux : elle n'est pas construite par défaut.
default-members = [
    "crates/mf-core",
    "crates/mf-eml",
    "crates/mf-msg",
    "crates/mf-analysis",
    "crates/mf-engine",
    "crates/mf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["pubtranos <pubtranos@gmail.com>"]

[workspace.dependencies]
mf-core = { path = "crates/mf-core" }
mf-eml = { path = "crates/mf-eml" }
mf-msg = { path = "crates/mf-msg" }
mf-analysis = { path = "crates/mf-analysis" }
mf-engine = { path = "crates/mf-engine" }
mail-parser = { version = "0.11", features = ["full_encoding"] }
cfb = "0.15"
encoding_rs = "0.8"
sha2 = "0.11"
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
ammonia = "4"
linkify = "0.11"
regex = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
msg_parser = "0.3"

# Moteur WebAssembly de la version web (feature 003) : taille minimale.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
